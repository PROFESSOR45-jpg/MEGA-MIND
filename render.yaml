services:
  - type: worker
    name: mega-mind-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_NAME
        value: MEGA MIND
      - key: OWNER_NUMBER
        sync: false
      - key: SESSION_ID
        sync: false
      - key: SESSION_SERVER_URL
        value: https://mega-mind-sessions.onrender.com
      - key: AUTO_FETCH_SESSION
        value: "false"
      - key: PREFIX
        value: "."
      - key: MODE
        value: public
      # ---- Downloaders (all optional) ----
      - key: MAX_DOWNLOAD_MB
        value: "100"
      - key: SEND_INLINE_MB
        value: "45"
      - key: YTDLP_MAX_HEIGHT
        value: "720"
      - key: DL_MAX_CONCURRENT
        value: "2"
      - key: YTDLP_COOKIES_B64
        sync: false
